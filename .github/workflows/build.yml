name: Build CORA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install Linux audio development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev

      - name: Build CORA
        working-directory: src
        env:
          CGO_ENABLED: '1'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go mod download
          go build -trimpath -ldflags="-s -w" -o ../cora-discord ./cmd/discord
          file ../cora-discord
          test -x ../cora-discord

      - name: Package Discloud artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifact
          mkdir -p artifact/CORA/data

          cp discloud.config artifact/CORA/discloud.config
          cp .env.example artifact/CORA/.env.example
          cp README.md artifact/CORA/README.md
          cp cora-discord artifact/CORA/cora-discord
          cp index.js artifact/CORA/index.js

          touch artifact/CORA/data/.gitkeep

          echo "=== CORA artifact ==="
          find artifact/CORA -maxdepth 2 -type f -printf '%P\n' | sort

          test -f artifact/CORA/discloud.config
          test -f artifact/CORA/.env.example
          test -f artifact/CORA/README.md
          test -f artifact/CORA/cora-discord
          test -f artifact/CORA/index.js
          test -f artifact/CORA/data/.gitkeep

      - name: Upload artifact CORA
        uses: actions/upload-artifact@v5
        with:
          name: CORA
          path: artifact/CORA
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
